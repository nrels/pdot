# Personal changes - Noah
set -g mouse on
set -g default-terminal "tmux-256color"
#set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p1%s;%p2%s\\7"
set -as terminal-overrides ',xterm*:Sxl@'

# Enable clipboard tracking and allow external tools to set it
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# Unbind default mouse drag end to prevent exiting copy mode
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# add additional prefix combo
# For Local sessions:
set-option -g prefix C-s

# For Remote sessions:
# set-option -g prefix C-b
# set-option -g prefix2 C-Space
#bind C-Space send-prefix2

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

set-option -g history-limit 5000000
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# mouse mode enabled
set -g mouse on

# enable global clipboard
set -g set-clipboard on

# start at 0 when numbering windows
# makes it easier to press :)
set -g base-index 1
setw -g pane-base-index 1

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour2

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# pane borders
set -g pane-border-style 'fg=colour2'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour2'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour2 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour2 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour2]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour2 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# neovim - image.nvim edits
set -gq allow-passthrough on
set -g visual-activity off

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

bind-key -N "Open Navi (cheat sheets)" -T prefix C-g split-window \
  "$SHELL --login -i -c 'navi --print | tmux load-buffer -b tmp - ; tmux paste-buffer -p -t {last} -b tmp -d'"

# Extended key reporting for pi (Shift+Enter, Ctrl+Enter, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u
